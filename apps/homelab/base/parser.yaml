# Phase 1 canary: stateless, no database, no published port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  labels:
    app.kubernetes.io/name: parser
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parser
        app.kubernetes.io/part-of: homelab
    spec:
      containers:
        - name: parser
          image: registry.example.internal/homelab/parser:latest
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parser
  labels:
    app.kubernetes.io/name: parser
spec:
  selector:
    app.kubernetes.io/name: parser
  ports:
    - name: http
      port: 8085
      targetPort: http
